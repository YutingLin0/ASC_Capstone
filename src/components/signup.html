<dialog id="signup">
<form id="form">
<span class="badge">DEMONSTRATION ONLY</span>
<h2 style="font-size:32px">Stay connected.</h2>
<p>Explore a future sign-up experience for “Every Connection Counts.” Use an example address only; this form sends and saves nothing.</p>
<label for="email">Example email address</label>
<input id="email" type="email" placeholder="you@example.com" required>
<button type="submit">Preview registration</button> <button type="button" class="secondary" id="close">Close</button>
<p id="confirmation" role="status">
</p>
</form>
</dialog>
